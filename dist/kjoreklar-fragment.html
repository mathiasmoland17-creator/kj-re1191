<title>Kjøreklar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Bli klar for oppkjøring klasse B: teori, skilt, trafikkbilder, sikkerhetskontroll og en 3D-kjøresimulator med speil, blindsone og realistisk trafikk.">
<meta name="theme-color" content="#3b4048">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@600;700&display=swap">
<style>
/* Kjøreklar: uttrykk hentet fra norsk vegskilting. Skiltblå, forkjørsgul, asfalt. */
:root {
  /* Layout: én kolonne med kort, rutenett som stables på mobil, fast fanelinje nederst på mobil */
  --bg: #eef1f4;
  --surface: #ffffff;
  --surface2: #f5f7f9;
  --ink: #132130;
  --muted: #56667a;
  --line: #d5dce4;
  --accent: #0b4ea2;
  --accent-ink: #ffffff;
  --accent-soft: #dfe9f7;
  --yellow: #f6c400;
  --asphalt: #3b4048;
  --ok: #17804a;
  --ok-soft: #e1f3e9;
  --bad: #c8102e;
  --bad-soft: #fbe5e8;
  --warn: #a96500;
  --shadow: 0 1px 2px rgba(19, 33, 48, 0.06), 0 6px 20px rgba(19, 33, 48, 0.06);
  --f-display: 'Barlow Semi Condensed', 'Barlow', 'Arial Narrow', Arial, sans-serif;
  --f-body: 'Barlow', 'Segoe UI', Roboto, Arial, sans-serif;
  --r: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --bg: #0e141b; --surface: #151d27; --surface2: #1b2531; --ink: #e6edf4; --muted: #95a4b5; --line: #283444;
    --accent: #4d8fe6; --accent-ink: #0b1420; --accent-soft: #19304e; --asphalt: #2a3038;
    --ok: #46c483; --ok-soft: #12301f; --bad: #ff5d6c; --bad-soft: #3a161b; --warn: #f0a23a;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25);
    color-scheme: dark;
  }
}
:root[data-theme='dark'] {
  --bg: #0e141b; --surface: #151d27; --surface2: #1b2531; --ink: #e6edf4; --muted: #95a4b5; --line: #283444;
  --accent: #4d8fe6; --accent-ink: #0b1420; --accent-soft: #19304e; --asphalt: #2a3038;
  --ok: #46c483; --ok-soft: #12301f; --bad: #ff5d6c; --bad-soft: #3a161b; --warn: #f0a23a;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 400 16px/1.55 var(--f-body); -webkit-font-smoothing: antialiased; }
body.sim-open { overflow: hidden; }
a { color: var(--accent); }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.12; text-wrap: balance; margin: 0 0 0.4em; letter-spacing: -0.005em; }
h1 { font-size: clamp(1.9rem, 4.2vw, 2.9rem); font-weight: 700; }
h2 { font-size: 1.5rem; font-weight: 700; }
h3 { font-size: 1.15rem; font-weight: 700; }
p { margin: 0 0 0.8em; }
kbd { font: 600 0.78rem/1 var(--f-body); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 2px 5px; background: var(--surface2); color: var(--ink); }
:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
.tnum { font-variant-numeric: tabular-nums; }

/* ---------- topp og navigasjon ---------- */
body::before { content: ''; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--asphalt); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--asphalt); color: #fff; border-bottom: 3px solid var(--yellow); }
.top-in { max-width: 1180px; margin: 0 auto; display: flex; align-items: center; gap: 20px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 10px; color: #fff; text-decoration: none; font: 700 1.35rem/1 var(--f-display); letter-spacing: 0.01em; }
.brand .sign { width: 30px; height: 30px; }
.nav { display: flex; gap: 2px; margin-left: auto; flex-wrap: wrap; }
.nav a { color: #d9e1ea; text-decoration: none; font: 600 0.95rem/1 var(--f-body); padding: 9px 11px; border-radius: 6px; }
.nav a:hover { background: rgba(255, 255, 255, 0.08); color: #fff; }
.nav a.active { background: var(--yellow); color: #111; }
.tabbar { display: none; }

main:focus, main:focus-visible { outline: none; }
main { max-width: 1180px; margin: 0 auto; padding-block: 28px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); outline: none; }

/* ---------- felles ---------- */
.eyebrow { font: 600 0.78rem/1.2 var(--f-body); text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); margin: 0 0 6px; }
.lead { font-size: 1.12rem; color: var(--muted); max-width: 62ch; }
.note { color: var(--muted); font-size: 0.9rem; margin: 0; }
.warn { color: var(--bad); font-weight: 600; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: 600 1rem/1 var(--f-body); padding: 12px 18px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; text-decoration: none; transition: transform 0.08s, background 0.15s; }
.btn:hover { background: var(--surface2); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { background: var(--accent); filter: brightness(1.08); }
.btn.sm { padding: 8px 12px; font-size: 0.9rem; }
.btn.wide { width: 100%; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 14px; }
.grid { display: grid; gap: 16px; }
.cards2 { grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); }
.cards3 { grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
.block { margin-top: 40px; }
.block-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.block-head h2 { margin: 0; }
.group-title { font-size: 1.05rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 14px; }
.page-head { margin-bottom: 8px; }
.page-head.compact h1 { font-size: 1.8rem; }
.sign { display: inline-block; flex: none; line-height: 0; }
.sign svg { width: 100%; height: 100%; display: block; }
.sign.xs { width: 22px; height: 22px; }
.sign.sm { width: 30px; height: 30px; }
.sign.md { width: 56px; height: 56px; }
.sign.lg { width: 92px; height: 92px; }
.sign.xl { width: 150px; height: 150px; }
.pill { display: inline-block; font: 600 0.78rem/1 var(--f-body); padding: 6px 9px; border-radius: 99px; background: var(--surface2); color: var(--muted); border: 1px solid var(--line); }
.pill.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.pill.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.ok { color: var(--ok); }
.bad { color: var(--bad); }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); text-decoration: none; font-weight: 600; font-size: 0.92rem; }
.quick { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.mini-bar, .bar { display: block; height: 6px; border-radius: 99px; background: var(--surface2); border: 1px solid var(--line); overflow: hidden; }
.mini-bar i, .bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.back { display: inline-block; text-decoration: none; font-weight: 600; margin-bottom: 14px; color: var(--muted); }

/* ---------- hjem ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 28px; align-items: start; }
.hero h1 { font-size: clamp(2rem, 4.6vw, 3.3rem); max-width: 18ch; }
.hero-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
.ready { padding: 20px; }
.ready-head { display: flex; justify-content: space-between; align-items: baseline; font: 700 1.1rem/1 var(--f-display); text-transform: uppercase; letter-spacing: 0.06em; }
.ready-head b { font-size: 2.4rem; letter-spacing: 0; font-variant-numeric: tabular-nums; color: var(--accent); }
.road-meter { position: relative; margin: 16px 0 18px; height: 40px; }
.road-meter > svg { position: absolute; inset: 10px 0 auto; width: 100%; height: 22px; }
.rm-road { fill: var(--asphalt); }
.rm-line { stroke: var(--yellow); stroke-width: 0.6; stroke-dasharray: 2.5 2.5; }
.rm-done { fill: var(--accent); opacity: 0.35; }
.rm-car { position: absolute; top: 8px; width: 34px; height: 26px; transform: translateX(-50%); color: #e23d28; }
.rm-car svg { width: 34px; height: 26px; }
.rm-flag { position: absolute; right: -6px; top: 0; }
.rm-flag .sign { width: 40px; height: 40px; }
.ready-parts { list-style: none; padding: 0; margin: 0 0 12px; display: grid; gap: 8px; }
.ready-parts li, .ready-parts li.lnk a { display: grid; grid-template-columns: minmax(0, 1fr) 90px 52px; gap: 12px; align-items: center; color: var(--ink); text-decoration: none; font-weight: 500; }
.ready-parts li.lnk { display: block; }
.ready-parts b { text-align: right; font-variant-numeric: tabular-nums; }
.path { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 10px; counter-reset: p; }
.path li a { display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: auto auto; column-gap: 12px; row-gap: 6px; align-items: center; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); color: var(--ink); text-decoration: none; font-weight: 600; }
.path li a .sign { grid-row: span 2; }
.path li a:hover { border-color: var(--accent); }
.recent { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.recent li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.recent li small { color: var(--muted); }
.recent li b { font-variant-numeric: tabular-nums; }

/* ---------- moduler ---------- */
.mod-card { display: flex; gap: 16px; padding: 18px; color: var(--ink); text-decoration: none; align-items: flex-start; }
.mod-card:hover { border-color: var(--accent); }
.mod-card h3 { margin-bottom: 4px; }
.mod-card p { color: var(--muted); font-size: 0.95rem; margin-bottom: 10px; }
.mod-card > div { min-width: 0; flex: 1; }
.lesson-head { display: flex; gap: 22px; align-items: center; margin-bottom: 22px; }
.lesson-head > div { min-width: 0; }
.lesson-grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 32px; align-items: start; }
.prose { max-width: 68ch; min-width: 0; }
.prose h3 { margin-top: 1.6em; font-size: 1.3rem; }
.prose h3:first-child { margin-top: 0; }
.prose ul, .prose ol { padding-left: 1.25em; }
.prose li { margin-bottom: 0.35em; }
.prose strong { font-weight: 700; }
.tbl { width: 100%; border-collapse: collapse; margin: 10px 0 16px; font-variant-numeric: tabular-nums; font-size: 0.95rem; display: block; overflow-x: auto; }
.tbl th, .tbl td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl th { font-family: var(--f-display); text-transform: uppercase; letter-spacing: 0.05em; font-size: 0.85rem; color: var(--muted); }
.lesson-side { display: grid; gap: 12px; position: sticky; top: 90px; }
.keybox, .sensorbox { padding: 16px 18px; }
.keybox ul, .sensorbox ul { margin: 0; padding-left: 1.1em; }
.keybox li, .sensorbox li { margin-bottom: 6px; }
.keybox { border-top: 4px solid var(--yellow); }
.sensorbox { border-top: 4px solid var(--accent); }
.check { list-style: none; padding: 0 !important; }
.check label { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.check input { margin-top: 5px; width: 18px; height: 18px; accent-color: var(--accent); }
.next { display: block; margin-top: 30px; padding: 16px 18px; text-decoration: none; color: var(--ink); max-width: 420px; }
.next small { display: block; color: var(--muted); }

/* ---------- skilt ---------- */
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 14px 0; }
.tab { font: 600 0.92rem/1 var(--f-body); padding: 9px 13px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.tab.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.cat-desc { color: var(--muted); margin-top: 18px; min-height: 1em; }
.sign-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 10px; }
.sign-tile { position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 8px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); cursor: pointer; font: 600 0.86rem/1.2 var(--f-body); color: var(--ink); text-align: center; }
.sign-tile:hover { border-color: var(--accent); }
.sign-tile .sign { width: 72px; height: 72px; }
.sign-tile small { position: absolute; top: 6px; left: 8px; color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
.sign-tile.known::after { content: '✓'; position: absolute; top: 6px; right: 8px; color: var(--ok); font-weight: 700; }
.sheet { border: none; border-radius: 14px; padding: 22px; max-width: min(560px, calc(100vw - 32px)); background: var(--surface); color: var(--ink); box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35); }
.sheet::backdrop { background: rgba(8, 14, 22, 0.55); }
.sheet-body { display: flex; gap: 20px; align-items: flex-start; margin-bottom: 16px; flex-wrap: wrap; }
.sheet-body > div { flex: 1; min-width: 200px; }

/* ---------- quiz ---------- */
.action { display: flex; flex-direction: column; gap: 6px; text-align: left; padding: 18px; cursor: pointer; color: var(--ink); text-decoration: none; font: inherit; }
.action b { font: 700 1.2rem/1.2 var(--f-display); }
.action span { color: var(--muted); }
.action:hover { border-color: var(--accent); }
.action.exam { border-top: 4px solid var(--bad); }
.cat-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 8px; }
.cat-row { display: grid; grid-template-columns: minmax(0, 1fr) 80px 30px; gap: 12px; align-items: center; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); cursor: pointer; font: 600 0.98rem/1.2 var(--f-body); color: var(--ink); text-align: left; }
.cat-row small { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.cat-row:hover { border-color: var(--accent); }
.quiz { max-width: 760px; margin: 0 auto; }
.quiz-top { display: flex; justify-content: space-between; gap: 12px; align-items: center; color: var(--muted); font-weight: 600; margin-bottom: 8px; }
.quiz-top .back { margin: 0; }
.quiz-bar { height: 5px; background: var(--line); border-radius: 99px; overflow: hidden; margin-bottom: 16px; }
.quiz-bar i { display: block; height: 100%; background: var(--yellow); transition: width 0.3s; }
.quiz-card { padding: 24px; }
.quiz-fig { display: flex; justify-content: center; margin-bottom: 12px; }
.quiz-cat { font: 600 0.8rem/1 var(--f-body); color: var(--accent); text-transform: uppercase; letter-spacing: 0.08em; }
.quiz-q { font-size: 1.45rem; margin-bottom: 18px; }
.quiz-opts { display: grid; gap: 8px; }
.opt { display: flex; gap: 12px; align-items: center; text-align: left; padding: 13px 14px; border: 1.5px solid var(--line); border-radius: 9px; background: var(--surface); color: var(--ink); font: 500 1rem/1.35 var(--f-body); cursor: pointer; }
.opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.opt-l { flex: none; width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; font: 700 0.9rem/1 var(--f-display); background: var(--surface2); border: 1px solid var(--line); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .opt-l { background: var(--ok); color: #fff; border-color: var(--ok); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .opt-l { background: var(--bad); color: #fff; border-color: var(--bad); }
.opt:disabled { cursor: default; }
.quiz-exp { margin-top: 16px; padding: 14px 16px; border-radius: 9px; background: var(--surface2); border-left: 4px solid var(--accent); }
.quiz-exp b { margin-right: 6px; }
.quiz-next { margin-top: 16px; display: flex; justify-content: flex-end; }
.quiz-result { max-width: 760px; margin: 0 auto; padding: 26px; }
.verdict { font: 700 1.3rem/1.2 var(--f-display); }
h1.verdict { font-size: 2.4rem; }
.review { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.review li { display: flex; gap: 12px; padding: 12px 14px; background: var(--surface2); border-radius: 9px; }
.review li > div { display: grid; gap: 3px; min-width: 0; }
.review span { color: var(--ok); font-weight: 600; }
.review small { color: var(--muted); }

/* ---------- trafikkbilder ---------- */
.sit-grid { display: grid; grid-template-columns: minmax(0, 420px) minmax(0, 1fr); gap: 24px; align-items: start; }
.sit-fig { margin: 0; padding: 10px; }
.sit-fig svg { width: 100%; height: auto; display: block; border-radius: 6px; }
.sit-fig figcaption { color: var(--muted); font-size: 0.85rem; padding: 8px 4px 2px; }
.sit-q h2 { font-size: 1.35rem; }
.sit-dots { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 22px; }
.dot { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; padding: 0; }
.dot.done { background: var(--ok); border-color: var(--ok); }
.dot.cur { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- simulator-kort ---------- */
.scen { display: flex; gap: 16px; padding: 18px; align-items: flex-start; }
.scen .scen-body { min-width: 0; flex: 1; display: flex; flex-direction: column; }
.scen h3 { margin-bottom: 6px; }
.scen p { color: var(--muted); font-size: 0.95rem; }
.scen-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: auto; flex-wrap: wrap; }
.scen.night { background: linear-gradient(160deg, #18212d, #0d131b); color: #e6edf4; border-color: #283444; }
.scen.night p, .scen.night .eyebrow { color: #a6b3c2; }
.keys-strip { display: flex; gap: 8px 18px; flex-wrap: wrap; color: var(--muted); font-size: 0.92rem; margin-top: 10px; }
.mock { display: flex; gap: 20px; justify-content: space-between; align-items: center; padding: 22px; margin: 18px 0 30px; border-left: 6px solid var(--yellow); flex-wrap: wrap; }
.mock > div { flex: 1; min-width: 240px; }

/* ---------- sikkerhetskontroll ---------- */
.flash-list { display: grid; gap: 8px; }
.flash { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.flash summary { cursor: pointer; padding: 14px 16px 14px 44px; font-weight: 600; list-style: none; position: relative; }
.flash summary::-webkit-details-marker { display: none; }
.flash summary::before { content: ''; position: absolute; left: 16px; top: 17px; width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); }
.flash.known summary::before { background: var(--ok); border-color: var(--ok); }
.flash.practice summary::before { background: var(--warn); border-color: var(--warn); }
.flash-a { padding: 0 16px 16px 44px; }
.flash-a p { margin: 0; }

/* ---------- mobil ---------- */
@media (max-width: 900px) {
  .hero, .lesson-grid, .sit-grid { grid-template-columns: minmax(0, 1fr); }
  .lesson-side { position: static; }
}
@media (max-width: 760px) {
  .nav { display: none; }
  .tabbar { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; inset: auto 0 0; z-index: 30; background: var(--asphalt); border-top: 3px solid var(--yellow); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
  .tabbar a { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 2px 9px; color: #c8d2dd; text-decoration: none; font: 600 0.72rem/1 var(--f-body); }
  .tabbar a svg { width: 22px; height: 22px; }
  .tabbar a.active { color: var(--yellow); }
  main { padding-bottom: calc(90px + env(safe-area-inset-bottom, 0px)); padding-top: 20px; }
  .lesson-head { flex-direction: column; align-items: flex-start; gap: 12px; }
  .sign.lg { width: 70px; height: 70px; }
  .quiz-card { padding: 18px; }
  .quiz-q { font-size: 1.25rem; }
  .ready-parts li, .ready-parts li.lnk a { grid-template-columns: minmax(0, 1fr) 64px 46px; gap: 10px; }
  .scen { flex-direction: column; }
}

/* =====================================================================
   SIMULATOR
   ===================================================================== */

.sim-mirror-left { border-radius: 12px 22px 18px 26px; }
.sim-mirror-right { border-radius: 22px 12px 26px 18px; }

@keyframes mflash { 0% { border-color: var(--yellow); box-shadow: 0 0 0 4px rgba(246, 196, 0, 0.5); } 100% { border-color: #121417; } }
.sim-instr { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); top: calc(12px + env(safe-area-inset-top, 0px)); max-width: min(30vw, 360px); background: rgba(10, 16, 24, 0.82); border-left: 4px solid var(--yellow); padding: 10px 14px; border-radius: 6px; font-size: 0.98rem; line-height: 1.35; backdrop-filter: blur(4px); }

.si-tag { display: inline-block; font: 700 0.7rem/1 var(--f-body); text-transform: uppercase; letter-spacing: 0.08em; background: var(--yellow); color: #111; padding: 3px 6px; border-radius: 3px; margin-right: 6px; vertical-align: 2px; }

.sim-dash { position: absolute; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: grid; grid-template-columns: auto auto auto auto; grid-template-rows: auto auto; align-items: center; gap: 4px 14px; background: rgba(8, 12, 18, 0.78); border-radius: 16px; padding: 10px 18px; backdrop-filter: blur(4px); border: 1px solid rgba(255, 255, 255, 0.08); }

.sd-num { font: 700 2.6rem/1 var(--f-display); font-variant-numeric: tabular-nums; }
.sd-unit { font-size: 0.8rem; color: #a7b4c2; }
.sim-dash.over .sd-num { color: #ff6b6b; }
.sd-blink { font-size: 1.5rem; color: #2b3a2e; transition: color 0.05s; }
.sd-blink.on { color: #3ee26a; text-shadow: 0 0 10px #3ee26a; }
.sd-limit { width: 50px; height: 50px; }
.sd-limit svg { width: 100%; height: 100%; }
.sd-ind { grid-column: 1 / -1; display: flex; gap: 8px; justify-content: center; font: 700 0.66rem/1 var(--f-body); letter-spacing: 0.06em; }
.sd-ind span { padding: 4px 6px; border-radius: 4px; color: #6b7785; border: 1px solid #2c3642; }
.sd-ind span.on { color: #111; background: var(--yellow); border-color: var(--yellow); }
.sd-high { display: none; }
.sim-night .sd-ind .sd-high { display: inline-block; }
.sim-dash .sd-high.on { background: #2f7cf6; border-color: #2f7cf6; color: #fff; }
.sim-map { position: absolute; left: max(14px, env(safe-area-inset-left, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); width: 150px; height: 150px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, 0.15); }
.sim-btns { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); top: calc(12px + env(safe-area-inset-top, 0px)); display: flex; gap: 6px; }
.sim-btns button { font: 700 0.85rem/1 var(--f-body); color: #fff; background: rgba(10, 16, 24, 0.75); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 8px; padding: 9px 11px; cursor: pointer; }
.sim-btns button.off { opacity: 0.5; text-decoration: line-through; }
.sim-touch { display: none; }
.sim-has-touch .sim-touch { display: block; }
.st-top { position: absolute; left: 0; right: 0; bottom: calc(132px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: center; gap: 6px; padding: 0 10px; flex-wrap: wrap; }
.st-top button, .st-pedals button { pointer-events: auto; touch-action: none; font: 700 0.8rem/1 var(--f-body); color: #fff; background: rgba(12, 18, 26, 0.72); border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 10px; padding: 11px 10px; }

.st-pedals { position: absolute; right: max(10px, env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); width: 42%; height: 110px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.st-pedals button { height: 100%; font-size: 0.95rem; }
.st-pedals .st-thr { background: rgba(20, 110, 60, 0.6); }
.st-pedals .st-brk { background: rgba(160, 20, 30, 0.6); }
.sim-has-touch .sim-dash { bottom: calc(186px + env(safe-area-inset-bottom, 0px)); padding: 6px 12px; gap: 2px 10px; }
.sim-has-touch .sd-num { font-size: 2rem; }
.sim-has-touch .sd-limit { width: 38px; height: 38px; }
.sim-has-touch .sim-map { display: none; }
.sim-small .sim-instr { max-width: none; right: 150px; font-size: 0.88rem; padding: 8px 10px; }
.sim-small .sim-map { width: 110px; height: 110px; }
.sim-small .sim-btns button { padding: 8px 9px; font-size: 0.78rem; }

.sim-overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; padding: 20px; padding-top: calc(20px + env(safe-area-inset-top, 0px)); background: rgba(5, 9, 14, 0.66); backdrop-filter: blur(5px); overflow-y: auto; z-index: 5; }
.sim-overlay.show { display: flex; }
.so-card { background: #f8fafc; color: #132130; border-radius: 14px; padding: 24px; width: min(640px, 100%); max-height: 100%; overflow-y: auto; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5); margin: auto; }

.so-eyebrow { font: 600 0.76rem/1 var(--f-body); text-transform: uppercase; letter-spacing: 0.09em; color: #5b6b7d; margin-bottom: 8px; }
.so-task { background: #fff8d6; border-left: 4px solid var(--yellow); padding: 12px 14px; border-radius: 6px; margin: 12px 0; }
.so-task p { margin: 4px 0 0; color: #2a3644; }
.so-keys summary { cursor: pointer; font-weight: 700; margin: 6px 0; }
.so-keylist { margin: 6px 0; padding-left: 1.1em; color: #2a3644; }
.so-keylist li { margin-bottom: 4px; }
.so-keylist kbd, .so-card kbd { background: #fff; color: #132130; border-color: #c8d0da; }
.so-small { font-size: 0.85rem; }
.so-opts { display: grid; gap: 6px; margin: 12px 0; }
.so-opts label { display: flex; gap: 8px; align-items: center; cursor: pointer; }
.so-opts input { width: 18px; height: 18px; accent-color: #0b4ea2; }
.so-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
.so-card .btn { background: #fff; color: #132130; border-color: #c8d0da; }
.so-card .btn-primary { background: #0b4ea2; color: #fff; border-color: #0b4ea2; }

.so-items .sev { font: 700 0.72rem/1 var(--f-body); text-transform: uppercase; letter-spacing: 0.06em; padding: 5px 6px; border-radius: 4px; text-align: center; align-self: start; }

<script>/* js/data/signs.js */
/* Norske trafikkskilt tegnet som SVG (forenklet, men tro mot form, farge og symbol). */
(function () {
  'use strict';
  const KA = (window.KA = window.KA || {});

  const R = '#c8102e', B = '#0b4ea2', Y = '#f6c400', W = '#ffffff', K = '#111111', G = '#9aa0a6';

  const wrap = (inner, vb = '0 0 100 100') =>
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb}" width="256" height="256">${inner}</svg>`;

  // ---------- skiltformer ----------
  const warn = (inner, fill = W) =>
    `<path d="M50 5 L96 89 Q97 93 92 93 L8 93 Q3 93 4 89 Z" fill="${R}"/>` +
    `<path d="M50 21 L83 83 L17 83 Z" fill="${fill}"/>${inner}`;
  const yieldSign = (inner = '') =>
    `<path d="M8 8 L92 8 Q96 8 94 12 L52 92 Q50 96 48 92 L6 12 Q4 8 8 8 Z" fill="${R}"/>` +
    `<path d="M22 17 L78 17 L50 72 Z" fill="${W}"/>${inner}`;
  const forbud = (inner, fill = W) =>
    `<circle cx="50" cy="50" r="47" fill="${R}"/><circle cx="50" cy="50" r="36" fill="${fill}"/>${inner}`;
  const paabud = (inner) =>
    `<circle cx="50" cy="50" r="47" fill="${W}"/><circle cx="50" cy="50" r="44" fill="${B}"/>${inner}`;
  const info = (inner, fill = B) =>
    `<rect x="3" y="3" width="94" height="94" rx="9" fill="${W}"/><rect x="6" y="6" width="88" height="88" rx="7" fill="${fill}"/>${inner}`;
  const stroke = (d, w = 6, c = K, cap = 'round') =>
    `<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="${cap}" stroke-linejoin="round"/>`;
  const txt = (s, x, y, size, c = K, weight = 800, family = 'Arial, Helvetica, sans-serif') =>
    `<text x="${x}" y="${y}" font-family="${family}" font-weight="${weight}" font-size="${size}" fill="${c}" text-anchor="middle" dominant-baseline="central">${s}</text>`;

  // ---------- symboler ----------
  const carRear = (x, y, s, c = K) => {
    // bil sett bakfra
    const w = 22 * s, h = 14 * s;
    return `<g transform="translate(${x - w / 2} ${y - h / 2})">` +
      `<path d="M${3 * s} ${6 * s} L${6 * s} ${0} L${16 * s} 0 L${19 * s} ${6 * s} L${22 * s} ${7 * s} L${22 * s} ${12 * s} L0 ${12 * s} L0 ${7 * s} Z" fill="${c}"/>` +
      `<rect x="${1 * s}" y="${11 * s}" width="${5 * s}" height="${4 * s}" rx="${1 * s}" fill="${c}"/>` +
      `<rect x="${16 * s}" y="${11 * s}" width="${5 * s}" height="${4 * s}" rx="${1 * s}" fill="${c}"/>` +
      `<rect x="${7 * s}" y="${1.5 * s}" width="${8 * s}" height="${3.5 * s}" fill="${W}" opacity=".85"/></g>`;
  };
  const person = (x, y, s = 1, c = K) =>
    `<g transform="translate(${x} ${y}) scale(${s})"><circle cx="2" cy="-17" r="4.5" fill="${c}"/>` +
    stroke('M1 -11 L-2 2 L-8 15 M-2 2 L5 15 M0 -8 L-8 -2 M0 -8 L8 -1', 4.5, c) + `</g>`;
  const bike = (x, y, s = 1, c = K) =>
    `<g transform="translate(${x} ${y}) scale(${s})" fill="none" stroke="${c}" stroke-width="3">` +
    `<circle cx="-11" cy="4" r="8"/><circle cx="11" cy="4" r="8"/>` +
    `<path d="M-11 4 L-3 -8 L8 -8 L11 4 M-3 -8 L1 4 L-11 4 M8 -8 L6 -13 L2 -13 M-5 -12 L0 -12" stroke-linejoin="round"/></g>`;
  const arrowUp = (x, y, len, w, c) =>
    `<path d="M${x} ${y - len / 2} L${x + w} ${y - len / 2 + w * 1.1} L${x + w * 0.4} ${y - len / 2 + w * 1.1} L${x + w * 0.4} ${y + len / 2} L${x - w * 0.4} ${y + len / 2} L${x - w * 0.4} ${y - len / 2 + w * 1.1} L${x - w} ${y - len / 2 + w * 1.1} Z" fill="${c}"/>`;
  const arrowDown = (x, y, len, w, c) =>
    `<g transform="rotate(180 ${x} ${y})">${arrowUp(x, y, len, w, c)}</g>`;
  const slash = (c = K, n = 1) => {
    if (n === 1) return stroke('M22 78 L78 22', 6, c);
    let s = '';
    for (let i = -2; i <= 2; i++) s += stroke(`M${26 + i * 7} ${82 + i * 7} L${82 + i * 7} ${26 + i * 7}`, 2.2, c, 'butt');
    return `<clipPath id="cl${n}"><circle cx="50" cy="50" r="38"/></clipPath><g clip-path="url(#cl${n})">${s}</g>`;
  };
  const moose = (c = K) =>
    `<g fill="${c}"><path d="M30 64 Q30 56 40 55 L58 55 Q63 50 66 50 L70 47 Q74 46 75 49 L75 53 Q73 56 70 56 L68 58 Q67 63 64 65 L64 76 L61 76 L60 67 L46 67 L44 76 L41 76 L40 67 Q36 68 35 76 L32 76 Q32 69 30 64 Z"/>` +
    `<path d="M66 50 Q62 42 64 38 L66 43 L67 37 L69 43 L71 38 L71 45 Q70 48 68 49 Z"/></g>`;

  const S = [];
  const add = (o) => S.push(o);

  // ================= FARESKILT =================
  add({ id: 'farlig-sving', nr: '100', cat: 'fare', name: 'Farlig sving', desc: 'Varsler en sving som kan være vanskelig å se eller krapp. Pilens retning viser hvilken vei svingen går. Senk farten før svingen, ikke i den.', svg: () => warn(stroke('M42 80 L42 64 Q42 50 56 46', 7) + `<path d="M54 37 L68 45 L55 54 Z" fill="${K}"/>`) });
  add({ id: 'farlige-svinger', nr: '102', cat: 'fare', name: 'Farlige svinger', desc: 'Varsler flere farlige svinger etter hverandre. Første sving går i den retningen symbolet starter.', svg: () => warn(stroke('M44 81 L44 72 Q44 64 52 61 Q59 58 58 50 L58 47', 6.5) + `<path d="M50 48 L58 36 L66 48 Z" fill="${K}"/>`) });
  add({ id: 'smalere-veg', nr: '106', cat: 'fare', name: 'Smalere veg', desc: 'Vegen blir smalere. Vær forberedt på møtende i et smalt parti, og plasser deg godt til høyre.', svg: () => warn(stroke('M38 81 L43 66 L43 46', 5) + stroke('M62 81 L57 66 L57 46', 5)) });
  add({ id: 'bratt-bakke', nr: '', cat: 'fare', name: 'Bratt bakke', desc: 'Varsler bratt bakke (her 10 % stigning/fall). Ned bakken: bruk lavere gir og motorbrems. Bremselengden blir lengre i nedoverbakke.', svg: () => warn(`<path d="M24 80 L76 80 L76 58 Z" fill="${K}"/>` + txt('10%', 47, 64, 13)) });
  add({ id: 'ujevn-veg', nr: '', cat: 'fare', name: 'Fartshump / ujevn veg', desc: 'Varsler fartshump eller ujevn vegbane. Senk farten.', svg: () => warn(`<path d="M24 78 L38 78 Q50 62 62 78 L76 78 L76 81 L24 81 Z" fill="${K}"/>`) });
  add({ id: 'glatt', nr: '', cat: 'fare', name: 'Glatt kjørebane', desc: 'Vegen kan være glatt, for eksempel av is, vann eller løv. Øk avstanden, kjør jevnt og unngå bråe bevegelser.', svg: () => warn(`<rect x="42" y="38" width="16" height="22" rx="4" fill="${K}"/>` + stroke('M42 66 Q36 70 42 74 Q48 78 42 82', 3) + stroke('M58 66 Q52 70 58 74 Q64 78 58 82', 3)) });
  add({ id: 'gangfelt-fare', nr: '116', cat: 'fare', name: 'Varsel om gangfelt', desc: 'Varsler at det kommer et gangfelt. Vær forberedt på gående, og senk farten hvis sikten er dårlig.', svg: () => warn(person(51, 66, 0.95) + `<g fill="${K}"><rect x="28" y="78" width="7" height="3"/><rect x="39" y="78" width="7" height="3"/><rect x="50" y="78" width="7" height="3"/><rect x="61" y="78" width="7" height="3"/></g>`) });
  add({ id: 'barn', nr: '', cat: 'fare', name: 'Barn', desc: 'Varsler at barn ofte ferdes her, for eksempel ved skole eller lekeplass. Barn er uforutsigbare. Senk farten og vær klar til å stoppe.', svg: () => warn(person(43, 64, 0.85) + person(60, 68, 0.65)) });
  add({ id: 'syklende', nr: '', cat: 'fare', name: 'Syklende', desc: 'Varsler at syklende ofte krysser eller kommer inn på vegen.', svg: () => warn(bike(50, 64, 0.95)) });

<script>/* js/data/modules.js */
/* Læringsmoduler: alt du må kunne til oppkjøring for klasse B. */
(function () {
  'use strict';
  const KA = (window.KA = window.KA || {});

  KA.modules = [
    {
      id: 'grunn', title: 'Grunnregler og ansvar', sign: 'annen-fare', group: 'Grunnlag',
      intro: 'Grunnregelen ligger under alt du gjør i trafikken. Sensor vurderer om du kjører trygt, hensynsfullt og selvstendig, ikke bare om du kan reglene.',
      body: `
<h3>Grunnregelen</h3>
<p><strong>Vegtrafikkloven § 3:</strong> Enhver skal ferdes hensynsfullt og være aktpågivende og varsom, så det ikke kan oppstå fare eller voldes skade, og slik at annen trafikk ikke unødig hindres eller forstyrres.</p>
<p>Grunnregelen betyr at du kan gjøre noe galt selv om ingen enkeltregel forbyr det. Kjører du i 80 km/t i tett tåke der fartsgrensen er 80, bryter du grunnregelen.</p>
<h3>Plassering</h3>
<ul>
<li>Kjør så langt til høyre som det er hensiktsmessig, med tanke på fart, sikt og andre trafikanter.</li>
<li>På veg med flere felt i samme retning skal du som hovedregel bruke feltet lengst til høyre og bruke venstre felt til forbikjøring.</li>
<li>I kø kan alle feltene brukes, og det regnes ikke som forbikjøring på høyre side om høyre felt går fortere.</li>
</ul>
<h3>Rus, trøtthet og distraksjon</h3>
<ul>
<li>Promillegrensen er <strong>0,2</strong>. Du kan fortsatt ha alkohol i blodet dagen etter.</li>
<li>Legemidler med <strong>rød varseltrekant</strong> på pakningen kan påvirke kjøreevnen.</li>
<li>Det er forbudt å bruke håndholdt mobiltelefon under kjøring. Dette gjelder også i kø og ved rødt lys.</li>
<li>Trøtthet virker omtrent som alkohol. Merker du at du blir trøtt, stopp og ta en pause.</li>
</ul>
<h3>Sikring</h3>
<p>Alle skal bruke bilbelte. Føreren har ansvar for at passasjerer under 15 år er sikret. Barn under 135 cm skal ha godkjent barnesikring. Barn i bakovervendt stol skal aldri sitte foran en aktiv kollisjonspute.</p>
<h3>Prøvetid og prikker</h3>
<p>De første to årene med førerkort har du prøvetid. Får du prikker i prøvetiden, teller de dobbelt. Får du <strong>8 prikker</strong> i løpet av tre år, mister du førerretten i seks måneder. Kjøring med promille i prøvetiden kan føre til ny førerprøve.</p>`,
      keys: ['Grunnregelen gjelder alltid, også der ingen skilt forteller deg hva du skal gjøre.', 'Promillegrensen er 0,2.', 'Ikke bruk håndholdt mobil under kjøring.', 'Prikker teller dobbelt i prøvetiden.'],
      sensor: ['Selvstendighet: at du tar egne, trygge valg uten å vente på instrukser.', 'At du viser hensyn og ikke hindrer andre unødig.'],

      intro: 'Linjer i vegbanen er like bindende som skilt. Gul og hvit farge betyr forskjellige ting.',
      body: `
<h3>Gul eller hvit linje</h3>
<ul>
<li><strong>Gul</strong> linje skiller trafikk i <em>motsatt</em> retning (midtlinje).</li>
<li><strong>Hvit</strong> linje skiller trafikk i <em>samme</em> retning (feltlinjer) og markerer vegkanten (kantlinje).</li>
</ul>
<h3>Typer midtlinjer</h3>
<ul>
<li><strong>Skillelinje</strong> (korte streker med lange mellomrom): du kan krysse den når det er trygt, for eksempel ved forbikjøring.</li>
<li><strong>Varsellinje</strong> (lange streker med korte mellomrom): varsler at det kommer en sperrelinje eller et farlig parti. Vær forsiktig med å krysse den.</li>
<li><strong>Sperrelinje</strong> (heltrukken): du kan ikke krysse den eller kjøre til venstre for den. Ved dobbel linje med én heltrukken og én stiplet gjelder den linjen som er nærmest deg.</li>
</ul>
<h3>Annen oppmerking</h3>
<ul>
<li><strong>Vikelinje</strong> («haitenner»): trekanter på tvers av feltet. Du har vikeplikt.</li>
<li><strong>Stopplinje</strong>: heltrukken tverrlinje ved stoppskilt eller trafikklys. Stopp før linjen.</li>
<li><strong>Sperreområde</strong>: skraverte felt. Du kan ikke kjøre inn i dem eller stanse der.</li>
<li><strong>Gangfelt</strong>: hvite striper på tvers av vegen («sebrastriper»).</li>
<li><strong>Kollektivfelt / sykkelfelt</strong>: merket med tekst eller symbol og skilt.</li>
<li><strong>Flettepiler</strong>: skrå piler som viser at et felt opphører og du må flette inn.</li>
</ul>`,
      keys: ['Gul linje skiller motsatt retning, hvit linje skiller samme retning.', 'Du kan ikke krysse en sperrelinje.', 'En varsellinje forteller at en sperrelinje kommer.', 'Du kan ikke kjøre inn i et sperreområde.'],
      sensor: ['Plassering i forhold til linjer, særlig at du ikke «kapper» svinger over midtlinjen.'],
    },

    { c: 'oppkjoring', q: 'Hva må du ha fullført før du kan gå opp til praktisk prøve for klasse B?', a: ['Obligatorisk opplæring, inkludert trinn 4 og bestått teoriprøve', 'Bare teoriprøven', 'Bare trafikalt grunnkurs', '20 timer med kjørelærer'], e: 'Teoriprøven og alle obligatoriske kurs, blant annet glattkjøring, mørkekjøring og sikkerhetskurs på veg, må være gjennomført.' },
    { c: 'oppkjoring', q: 'Hva skjer først på oppkjøringen?', a: ['Sikkerhetskontroll av kjøretøyet', 'Motorvegkjøring', 'Rygging', 'Teoriprøve'], e: 'Du starter med sikkerhetskontroll. Sensor spør, og du viser og forklarer.' },
    { c: 'oppkjoring', q: 'Du gjør en liten feil tidlig på oppkjøringen. Hva bør du gjøre?', a: ['Fortsette å kjøre trygt og konsentrert. En feil er ikke automatisk stryk', 'Gi opp og be om å avslutte', 'Kjøre ekstra fort for å ta igjen tid', 'Diskutere feilen med sensor'], e: 'Sensor gjør en helhetsvurdering. Fokuser på resten av kjøringen.' },
    { c: 'oppkjoring', q: 'Hvilken feil er en av de vanligste stryk-årsakene?', a: ['Manglende observasjon, for eksempel skulderblikk ved feltskifte', 'At du sier for lite', 'At du kjører for jevnt', 'At du bruker motorbrems'], e: 'Mangelfull observasjon, brudd på vikeplikt og feil fart er blant de vanligste årsakene.' },
    { c: 'oppkjoring', q: 'Du er usikker på hva sensor mente med en instruks. Hva gjør du?', a: ['Spør, eller kjør trygt og velg en løsning. Feil veg er ikke en feil i seg selv', 'Bremser brått og stopper i vegen', 'Gjetter og gjør en farlig manøver for å følge ruta', 'Ignorerer det'], e: 'Kjører du feil veg, men gjør det trygt, er det ikke en feil i seg selv. Sikkerhet går foran ruta.' },
  ];

  // stabile id-er basert på innhold
  const hash = (s) => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); };
  Q.forEach((q) => (q.id = q.c + '-' + hash(q.q)));

  // automatiske skiltspørsmål
  const signs = KA.signs.list;
  signs.forEach((s) => {
    const pool = signs.filter((o) => o.id !== s.id && o.cat === s.cat && !(o.speed && s.speed));
    const others = signs.filter((o) => o.id !== s.id && o.cat !== s.cat);
    const pick = [];
    const src = pool.length >= 3 ? pool : pool.concat(others);
    const shuffled = src.slice().sort(() => Math.random() - 0.5);
    for (const o of shuffled) { if (pick.length >= 3) break; if (!pick.includes(o.name)) pick.push(o.name); }
    Q.push({ id: 'skilt-' + s.id, c: 'skilt', sign: s.id, q: 'Hva betyr dette skiltet?', a: [s.name].concat(pick), e: s.desc });
  });

  KA.questions = Q;
  KA.qcats = {
    grunn: 'Grunnregler', merking: 'Vegoppmerking', vikeplikt: 'Vikeplikt', rundkjoring: 'Rundkjøring', motorveg: 'Motorveg', felt: 'Feltskifte og glidelås', fart: 'Fart og avstand', myke: 'Myke trafikanter', forbikjoring: 'Forbikjøring', morke: 'Mørke og vilt', vinter: 'Vinter og føre', kjoretoy: 'Kjøretøyet', ulykke: 'Ulykke og førstehjelp', miljo: 'Miljø', parkering: 'Stans og parkering', oppkjoring: 'Oppkjøringen', skilt: 'Skilt',
  };
})();

<script>/* js/data/situations.js */
/* Trafikksituasjoner tegnet ovenfra: hvem kjører først, hva gjør du? */
(function () {
  'use strict';
  const KA = (window.KA = window.KA || {});

  const COL = { A: '#e23d28', B: '#1f6fd1', C: '#1d9a5b', D: '#e8a317' };
  const ROT = { S: 0, N: 180, E: -90, W: 90 };
  const POS = { S: [165, 232], N: [135, 68], E: [232, 135], W: [68, 165] };
  // lokale piler (bil peker opp)
  const TURN = {
    straight: 'M0 -18 L0 -150',
    left: 'M0 -18 Q0 -97 -95 -97',
    right: 'M0 -18 Q0 -67 62 -67',
  };

  function car(id, arm, turn, opts = {}) {
    const [x, y] = opts.pos || POS[arm];
    const r = opts.rot != null ? opts.rot : ROT[arm];
    const c = opts.color || COL[id] || '#444';
    const arrow = turn ? `<path d="${TURN[turn]}" fill="none" stroke="${c}" stroke-width="3.5" stroke-dasharray="7 5" stroke-linecap="round" marker-end="url(#ah-${id})" opacity=".85"/>` : '';
    const w = opts.w || 18, h = opts.h || 32;
    let body = `<rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" rx="5" fill="${c}" stroke="#fff" stroke-width="1.5"/>` +
      `<rect x="${-w / 2 + 2.5}" y="${-h / 2 + 5}" width="${w - 5}" height="6" rx="2" fill="#1b2530" opacity=".75"/>` +
      `<rect x="${-w / 2 + 2.5}" y="${h / 2 - 8}" width="${w - 5}" height="4" rx="1.5" fill="#1b2530" opacity=".55"/>`;
    if (opts.blue) body += `<rect x="-7" y="-2" width="6" height="3.5" fill="#3aa0ff"/><rect x="1" y="-2" width="6" height="3.5" fill="#3aa0ff"/>`;
    if (opts.blinkL) body += `<circle cx="${-w / 2}" cy="${h / 2 - 2}" r="3.2" fill="#ffb000"/><circle cx="${-w / 2}" cy="${-h / 2 + 2}" r="3.2" fill="#ffb000"/>`;
    if (opts.blinkR) body += `<circle cx="${w / 2}" cy="${h / 2 - 2}" r="3.2" fill="#ffb000"/><circle cx="${w / 2}" cy="${-h / 2 + 2}" r="3.2" fill="#ffb000"/>`;
    const lbl = opts.label || id;
    const label = `<g transform="rotate(${-r})"><text y="1" font-size="${lbl.length > 2 ? 9 : 12}" font-weight="800" text-anchor="middle" dominant-baseline="central" fill="#fff" stroke="#111" stroke-width="2.6" paint-order="stroke" font-family="Arial">${lbl}</text></g>`;
    return `<defs><marker id="ah-${id}" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="6" refY="7" orient="auto"><path d="M0 0 L14 7 L0 14 Z" fill="${c}"/></marker></defs>` +
      `<g transform="translate(${x} ${y}) rotate(${r})">${arrow}${body}${label}</g>`;
  }

  const signImg = (id, x, y, s = 22) => `<image href="${KA.signs.dataUrl(id)}" x="${x - s / 2}" y="${y - s / 2}" width="${s}" height="${s}"/>`;
  const SIGNPOS = { S: [198, 200], N: [102, 100], E: [200, 102], W: [100, 198] };

  function roads(arms, o = {}) {
    let s = `<rect width="300" height="300" fill="#7fa35b"/>`;
    // hus/hekk for boligstemning
    if (o.hedges) s += `<g fill="#3f6b2f">${[[60, 60], [240, 60], [60, 240], [240, 240]].map(([x, y]) => `<rect x="${x - 50}" y="${y - 50}" width="100" height="100" rx="12" opacity=".95"/>`).join('')}</g>`;
    const g = '#5d6166';
    if (arms.includes('N')) s += `<rect x="120" y="0" width="60" height="150" fill="${g}"/>`;
    if (arms.includes('S')) s += `<rect x="120" y="150" width="60" height="150" fill="${g}"/>`;
    if (arms.includes('E')) s += `<rect x="150" y="120" width="150" height="60" fill="${g}"/>`;
    if (arms.includes('W')) s += `<rect x="0" y="120" width="150" height="60" fill="${g}"/>`;
    s += `<rect x="120" y="120" width="60" height="60" fill="${g}"/>`;
    if (!o.noLines) {
      const y = '#f0c419';
      if (arms.includes('N')) s += `<line x1="150" y1="0" x2="150" y2="115" stroke="${y}" stroke-width="2" stroke-dasharray="10 8"/>`;
      if (arms.includes('S')) s += `<line x1="150" y1="185" x2="150" y2="300" stroke="${y}" stroke-width="2" stroke-dasharray="10 8"/>`;
      if (arms.includes('E')) s += `<line x1="185" y1="150" x2="300" y2="150" stroke="${y}" stroke-width="2" stroke-dasharray="10 8"/>`;
      if (arms.includes('W')) s += `<line x1="0" y1="150" x2="115" y2="150" stroke="${y}" stroke-width="2" stroke-dasharray="10 8"/>`;
    }
    return s;
  }

  function zebra(arm) {
    // gangfelt på armen, nær krysset
    const st = [];
    for (let i = 0; i < 6; i++) {
      const t = 123 + i * 10;
      if (arm === 'E') st.push(`<rect x="196" y="${t}" width="16" height="6" fill="#fff"/>`);
      if (arm === 'W') st.push(`<rect x="88" y="${t}" width="16" height="6" fill="#fff"/>`);
      if (arm === 'N') st.push(`<rect x="${t}" y="88" width="6" height="16" fill="#fff"/>`);
      if (arm === 'S') st.push(`<rect x="${t}" y="196" width="6" height="16" fill="#fff"/>`);
    }
    return st.join('');
  }
  const ped = (x, y, c = '#ffd23f') => `<g transform="translate(${x} ${y})"><circle r="6" fill="${c}" stroke="#111" stroke-width="1.5"/><circle r="2.5" fill="#111"/></g>`;

  function render(sp) {
    let s = '';
    if (sp.type === 'street') {
      s += `<rect width="300" height="300" fill="#7fa35b"/><rect x="100" y="0" width="100" height="300" fill="#5d6166"/>` +
        `<rect x="200" y="0" width="22" height="300" fill="#a7a59d"/><rect x="78" y="0" width="22" height="300" fill="#a7a59d"/>` +
        `<line x1="150" y1="0" x2="150" y2="300" stroke="#f0c419" stroke-width="2" stroke-dasharray="10 8"/>`;
      if (sp.busStop) s += `<rect x="176" y="60" width="24" height="70" fill="#6d7177"/><text x="211" y="95" font-size="10" fill="#111" font-family="Arial" transform="rotate(90 211 95)" text-anchor="middle">BUSS</text>`;
      if (sp.bikeLane) s += `<rect x="186" y="0" width="14" height="300" fill="#8c4a3a" opacity=".55"/>`;
      (sp.cars || []).forEach((c) => (s += car(c.id, 'S', c.turn, c)));
      if (sp.signs) sp.signs.forEach(([id, x, y]) => (s += signImg(id, x, y)));
      return `<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" role="img">${s}</svg>`;
    }
    if (sp.type === 'round') {
      s += roads(['N', 'S', 'E', 'W'], { noLines: true });
      s += `<circle cx="150" cy="150" r="64" fill="#5d6166"/><circle cx="150" cy="150" r="30" fill="#6e9a4c" stroke="#d8d6cf" stroke-width="4"/>`;
      s += `<g fill="#fff">${[0, 1, 2, 3, 4].map((i) => `<path d="M${152 + i * 6} 216 l3 6 l3 -6 z"/>`).join('')}</g>`;
      s += signImg('vikeplikt', 198, 226, 20) + signImg('rundkjoring', 220, 226, 20);
      (sp.cars || []).forEach((c) => (s += car(c.id, c.arm, c.turn, c)));
      return `<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" role="img">${s}</svg>`;
    }
    const arms = sp.arms || ['N', 'S', 'E', 'W'];
    s += roads(arms, sp);
    if (sp.tram) s += `<g stroke="#c9c3b8" stroke-width="2"><line x1="0" y1="140" x2="300" y2="140"/><line x1="0" y1="160" x2="300" y2="160"/></g>`;
    if (sp.parking) s += `<rect x="110" y="250" width="80" height="50" fill="#666a70"/><text x="150" y="285" font-size="18" font-weight="800" fill="#fff" text-anchor="middle" font-family="Arial">P</text>`;
    if (sp.zebra) s += zebra(sp.zebra);
    if (sp.stopLine) s += `<rect x="150" y="184" width="30" height="4" fill="#fff"/>`;
    if (sp.signs) Object.entries(sp.signs).forEach(([arm, id]) => { const [x, y] = SIGNPOS[arm]; s += signImg(id, x, y); });
    if (sp.peds) sp.peds.forEach(([x, y]) => (s += ped(x, y)));
    if (sp.tramCar) s += `<g transform="translate(${sp.tramCar[0]} ${sp.tramCar[1]})"><rect x="-38" y="-9" width="76" height="18" rx="5" fill="#2f6fcc" stroke="#fff" stroke-width="1.5"/><text y="1" font-size="10" font-weight="800" fill="#fff" text-anchor="middle" dominant-baseline="central" font-family="Arial">TRIKK</text></g>`;
    if (sp.bike) s += `<g transform="translate(${sp.bike[0]} ${sp.bike[1]})"><rect x="-3" y="-10" width="6" height="20" rx="3" fill="#ffd23f" stroke="#111"/><circle r="3.5" fill="#111"/></g>`;
    (sp.cars || []).forEach((c) => (s += car(c.id, c.arm, c.turn, c)));
    return `<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" role="img">${s}</svg>`;
  }

  KA.situations = [
    { id: 'hoyre1', title: 'Boligkryss uten skilt', spec: { hedges: true, cars: [{ id: 'A', arm: 'S', turn: 'straight', label: 'Du' }, { id: 'B', arm: 'E', turn: 'straight' }] }, q: 'Du (A) og B kommer samtidig til krysset. Det er ingen skilt. Hvem kjører først?', a: ['B', 'Du (A)', 'Den som er nærmest', 'Den som blinker'], e: 'Høyreregelen gjelder: B kommer fra din høyre side. Hekkene gir dårlig sikt, så du må komme sakte inn mot krysset.' },
    { id: 'venstre1', title: 'Venstresving', spec: { cars: [{ id: 'A', arm: 'S', turn: 'left', label: 'Du', blinkL: true }, { id: 'B', arm: 'N', turn: 'straight' }] }, q: 'Du skal svinge til venstre. B kommer imot og skal rett fram. Hvem kjører først?', a: ['B', 'Du (A)', 'Begge samtidig', 'Den som kom først'], e: 'Venstresvingende har vikeplikt for møtende som skal rett fram eller til høyre.' },
    { id: 'forkjors1', title: 'Forkjørsveg', spec: { signs: { S: 'forkjorsveg', N: 'forkjorsveg', E: 'vikeplikt', W: 'vikeplikt' }, cars: [{ id: 'A', arm: 'S', turn: 'straight', label: 'Du' }, { id: 'B', arm: 'E', turn: 'straight' }] }, q: 'Du kjører på forkjørsveg. B har vikepliktskilt. Hvem kjører først?', a: ['Du (A)', 'B, fordi B kommer fra høyre', 'Den som er raskest', 'Begge må stoppe'], e: 'Skilt går foran høyreregelen. B har vikeplikt.' },
    { id: 'tre1', title: 'Tre biler, ingen skilt', spec: { cars: [{ id: 'A', arm: 'S', turn: 'left', blinkL: true }, { id: 'B', arm: 'N', turn: 'right', blinkL: true }, { id: 'C', arm: 'E', turn: 'straight' }] }, q: 'Ingen skilt. I hvilken rekkefølge kjører bilene?', a: ['B, C, A', 'A, B, C', 'C, B, A', 'B, A, C'], e: 'B har ingen fra høyre og svinger av, så B kjører først. C har B på sin høyre side og venter på B. A har C på sin høyre side, og må dessuten vike for møtende fordi A svinger til venstre. Derfor kjører A sist.' },
    { id: 'tre2', title: 'Hvem viker for hvem?', spec: { cars: [{ id: 'A', arm: 'S', turn: 'straight' }, { id: 'B', arm: 'W', turn: 'straight' }] }, q: 'Ingen skilt. A og B kommer samtidig. Hvem kjører først?', a: ['A', 'B', 'Den som er nærmest', 'Begge samtidig'], e: 'For B kommer A fra høyre. B har derfor vikeplikt.' },
    { id: 'parkering1', title: 'Ut fra parkeringsplass', spec: { arms: ['S', 'E', 'W'], parking: true, cars: [{ id: 'A', arm: 'S', turn: 'left', label: 'Du', blinkL: true }, { id: 'B', arm: 'W', turn: 'straight' }, { id: 'C', arm: 'E', turn: 'straight' }] }, q: 'Du kjører ut fra en parkeringsplass. B og C kommer på vegen. Hvem har vikeplikt?', a: ['Du har vikeplikt for både B og C', 'Bare C, fordi C er til høyre', 'B og C har vikeplikt for deg', 'Bare B'], e: 'Kjører du ut fra parkeringsplass, har du vikeplikt for alle. Høyreregelen gjelder ikke her.' },
    { id: 'gangfelt1', title: 'Høyresving og gående', spec: { zebra: 'E', peds: [[204, 165]], cars: [{ id: 'A', arm: 'S', turn: 'right', label: 'Du', blinkR: true }] }, q: 'Du svinger til høyre. En gående er ute i gangfeltet du skal kjøre over. Hva gjør du?', a: ['Venter til den gående har gått over', 'Kjører foran den gående', 'Tuter', 'Kjører bak den gående mens den går'], e: 'Du har vikeplikt for gående som er ute i eller på vei ut i gangfeltet.' },
    { id: 'rundkjoring1', title: 'Rundkjøring', spec: { type: 'round', cars: [{ id: 'A', arm: 'S', turn: null, label: 'Du', pos: [165, 252] }, { id: 'B', arm: 'S', turn: null, pos: [100, 188], rot: 140 }] }, q: 'Du skal inn i rundkjøringen. B er i rundkjøringen og kommer fra venstre. Hvem kjører først?', a: ['B', 'Du (A)', 'Den som blinker', 'Den som har høyest fart'], e: 'Du har vikeplikt for trafikk som er i rundkjøringen.' },
    { id: 'trikk1', title: 'Trikk i krysset', spec: { tram: true, tramCar: [55, 140], cars: [{ id: 'A', arm: 'S', turn: 'straight', label: 'Du' }] }, q: 'Ingen skilt. Trikken kommer fra venstre. Hvem kjører først?', a: ['Trikken', 'Du, fordi trikken er på venstre side', 'Den som kommer først', 'Du, hvis du blinker'], e: 'Du har vikeplikt for sporvogn, uansett hvor den kommer fra, med mindre skilt sier noe annet.' },
    { id: 'buss1', title: 'Buss på holdeplass', spec: { type: 'street', busStop: true, signs: [['fart-50', 236, 230]], cars: [{ id: 'A', pos: [175, 240], label: 'Du' }, { id: 'B', pos: [188, 95], color: '#d97c12', label: 'Buss', w: 22, h: 60, blinkL: true }] }, q: 'Bussen gir tegn for å kjøre ut fra holdeplassen. Fartsgrensen er 50. Hva gjør du?', a: ['Senker farten og slipper bussen ut', 'Kjører forbi før bussen kommer ut', 'Tuter', 'Bussen har vikeplikt'], e: 'Der fartsgrensen er 60 km/t eller lavere, skal du gi buss som gir tegn mulighet til å kjøre ut.' },

    { id: 'stopp1', title: 'Stoppskilt', spec: { signs: { S: 'stopp' }, stopLine: true, cars: [{ id: 'A', arm: 'S', turn: 'straight', label: 'Du' }] }, q: 'Du har stoppskilt, og ingen kommer. Hva gjør du?', a: ['Stopper helt ved stopplinjen og kjører så', 'Ruller sakte over', 'Kjører uten å stoppe', 'Stopper bare hvis noen kommer'], e: 'Ved stoppskilt er det alltid stoppeplikt, også når vegen er fri.' },

    { id: 'sykkel1', title: 'Høyresving over sykkelfelt', spec: { arms: ['N', 'S', 'E'], bike: [192, 272], cars: [{ id: 'A', arm: 'S', turn: 'right', label: 'Du', blinkR: true, pos: [165, 222] }] }, q: 'Du skal svinge til høyre. En syklist kommer bak deg til høyre og skal rett fram. Hva gjelder?', a: ['Du har vikeplikt for syklisten', 'Syklisten må vente', 'Du blinker og svinger', 'Høyreregelen gir deg forkjørsrett'], e: 'Ved høyresving må du se etter syklende i blindsonen. Du har vikeplikt for syklende som fortsetter rett fram langs vegen eller i sykkelfelt.' },
  ];
  KA.renderSituation = render;
})();

<script>/* js/data/safety.js */
/* Sikkerhetskontroll: typiske spørsmål fra sensor på oppkjøring klasse B. */
(function () {
  'use strict';
  const KA = (window.KA = window.KA || {});
  KA.safety = [
    { g: 'Lys', q: 'Vis hvordan du kontrollerer at alle lysene virker.', a: 'Slå på tenningen og sett på lys. Gå rundt bilen og sjekk nærlys, fjernlys, parklys, baklys, skiltlys, blinklys foran, bak og på siden, og nødblink. Bremselysene sjekker du med hjelp eller ved refleks i en vegg eller rute. Lysene skal være hele og rene. Hvorfor: du skal se og bli sett, og andre må forstå hva du skal gjøre.' },
    { g: 'Lys', q: 'Hvordan kontrollerer du bremselysene alene?', a: 'Rygg nær en vegg, garasjeport eller butikkrute og se refleksen i speilet når du trår på bremsen. Du kan også bruke noe som holder pedalen nede, og gå bak bilen og se.' },
    { g: 'Lys', q: 'Hva gjør du hvis et blinklys lyser raskere enn vanlig?', a: 'Rask blinking betyr som regel at en pære er gått på den siden. Skift pæren før du kjører videre, fordi andre ikke ser signalet ditt.' },
    { g: 'Lys', q: 'Hvordan kan du se om lyktene er riktig innstilt?', a: 'Stå på flat mark mot en vegg. Nærlyset skal ha en skarp grense som peker litt ned og mot høyre. Tung last bak løfter lyset, så bruk nivåreguleringen hvis bilen har det.' },

    { g: 'Dekk', q: 'Hvor finner du riktig lufttrykk, og hvorfor er det viktig?', a: 'Riktig trykk står i dørkarmen, på innsiden av tanklokket eller i instruksjonsboka. Kontroller det på kalde dekk. Feil trykk gir dårligere veggrep, lengre bremselengde, mer slitasje og høyere forbruk.' },
    { g: 'Dekk', q: 'Hvilke skader på dekk ser du etter?', a: 'Kutt, bulker på siden, sprekker, fremmedlegemer og ujevn slitasje. Ujevn slitasje kan tyde på feil hjulstilling eller feil trykk. Bulker betyr at dekket er skadet innvendig og må byttes.' },
    { g: 'Bremser', q: 'Hvordan kontrollerer du bremsevæsken?', a: 'Beholderen sitter i motorrommet, ofte på førersiden. Nivået skal være mellom MIN og MAX. Synker nivået, kan det skyldes slitte bremseklosser eller lekkasje, og det må sjekkes på verksted.' },
    { g: 'Bremser', q: 'Hvordan kontrollerer du bremsene før kjøring?', a: 'Trå på pedalen med motoren i gang. Den skal være fast og ikke synke. Prøvebrems forsiktig i lav fart når du har startet. Bilen skal ikke trekke til siden. Varsellampen for bremser skal slukke etter start.' },
    { g: 'Bremser', q: 'Hvordan kontrollerer du parkeringsbremsen?', a: 'Sett på parkeringsbremsen og prøv å kjøre forsiktig av gårde. Bilen skal holde igjen. På elektronisk parkeringsbrems skal lampen lyse når den er på.' },
    { g: 'Bremser', q: 'Hva betyr det om ABS-lampen lyser under kjøring?', a: 'ABS-systemet virker ikke, men vanlige bremser virker fortsatt. Hjulene kan låse seg ved hard brems. Kjør forsiktig og få det kontrollert snart.' },
    { g: 'Motorrom', q: 'Vis hvordan du kontrollerer motoroljen.', a: 'Bilen skal stå på flat mark med motoren stanset (gjerne noen minutter). Trekk ut peilepinnen, tørk den, sett den inn igjen og trekk den ut. Nivået skal være mellom merkene. Etterfyll riktig type olje ved behov. Mange nye biler viser nivået elektronisk.' },
    { g: 'Motorrom', q: 'Hvordan kontrollerer du kjølevæsken, og hva må du passe på?', a: 'Se på ekspansjonstanken. Nivået skal være mellom MIN og MAX. Kontroller når motoren er kald, fordi systemet står under trykk når det er varmt og kan gi brannskader. Om vinteren må væsken ha frostvæske.' },
    { g: 'Motorrom', q: 'Hvor fyller du spylervæske, og hvorfor er det viktig om vinteren?', a: 'Beholderen er merket med et vindusspylersymbol. Om vinteren bruker du spylervæske med frostvæske. Uten spylervæske kan saltsprut gjøre at du mister sikten på sekunder.' },
    { g: 'Motorrom', q: 'Hva gjør du hvis temperaturmåleren eller kjølevæskelampen viser rødt?', a: 'Stopp så snart det er trygt og slå av motoren. Ikke åpne kjølesystemet mens det er varmt. Overoppheting kan gi alvorlig motorskade.' },
    { g: 'Styring', q: 'Hvordan kontrollerer du styringen?', a: 'Med motoren i gang skal det være lett å vri rattet (servostyring) uten unormalt slark eller lyder. Bilen skal gå rett fram uten å trekke. Lyser varsellampen for servostyring, må det kontrolleres.' },

    { g: 'Sikt', q: 'Hvordan stiller du inn sidespeilene?', a: 'Still dem slik at du så vidt ser siden av egen bil i innerkanten av speilet, og horisonten midt i speilet. Da får du minst mulig overlapp med innvendig speil, men blindsonen forsvinner aldri helt. Derfor tar du skulderblikk.' },

    { g: 'Last', q: 'Hvordan sikrer du last i bilen?', a: 'Tunge ting legger du lavt og helst mot seteryggen, og fester dem med stropper eller lastenett. Løse gjenstander kan bli livsfarlige ved bråbrems. Totalvekt og takbelastning står i vognkortet og instruksjonsboka.' },
    { g: 'Last', q: 'Hvordan påvirker tung last og tilhenger kjøringen?', a: 'Bremselengden øker, bilen blir tregere å akselerere og kan bli ustabil i sving. Lyktene kan peke for høyt. Dekktrykket bør justeres for full last etter instruksjonsboka.' },
    { g: 'Elbil', q: 'Hva bør du vite om elbil i sikkerhetskontrollen?', a: 'Kontrollen er stort sett den samme: lys, dekk, bremser, styring og sikt. Elbiler er tunge, så dekkslitasje og dekktrykk er viktig. Regenerativ brems gjør at bremseskivene kan ruste. Varsellamper for batteri eller drivlinje skal tas på alvor. Høyspentsystemet (oransje kabler) skal du ikke røre.' },
  ];
})();

<script>/* js/sim/core.js */
/* Simulator-kjerne: baner (paths), geometribygger, 3D-modeller. Krever THREE (r128). */
(function () {
  'use strict';
  const KA = (window.KA = window.KA || {});
  if (!window.THREE) return;
  const SIM = (KA.sim = KA.sim || {});
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  SIM.clamp = clamp; SIM.lerp = lerp;
  SIM.wrapAng = (a) => { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };
  SIM.rand = (a, b) => a + Math.random() * (b - a);

  // ------------------------------------------------------------------
  // Path: polylinje samplet med fast steg (meter). x = øst, z = sør.
  // Høyre normal for retning t er n = (-tz, tx).
  // ------------------------------------------------------------------
  let pathId = 0;
  class Path {
    constructor(pts, opts = {}) {
      this.id = ++pathId;
      this.name = opts.name || 'p' + this.id;
      const step = (this.step = opts.step || 1);
      const out = [[pts[0][0], pts[0][1]]];
      const cum = [0];
      let acc = 0, next = step;
      for (let i = 1; i < pts.length; i++) {
        const ax = pts[i - 1][0], az = pts[i - 1][1], bx = pts[i][0], bz = pts[i][1];
        const L = Math.hypot(bx - ax, bz - az);
        if (L < 1e-6) continue;
        while (next <= acc + L) {
          const t = (next - acc) / L;
          out.push([ax + (bx - ax) * t, az + (bz - az) * t]);
          cum.push(next);
          next += step;
        }
        acc += L;
      }
      const last = pts[pts.length - 1];
      if (acc - cum[cum.length - 1] > 0.01) { out.push([last[0], last[1]]); cum.push(acc); }
      this.p = out; this.cum = cum; this.n = out.length; this.length = cum[cum.length - 1];
      this.closed = !!opts.closed;
    }
    idx(s) { return clamp(Math.floor(s / this.step), 0, this.n - 2); }
    pos(s) {
      if (this.closed) s = ((s % this.length) + this.length) % this.length;
      s = clamp(s, 0, this.length);
      const i = this.idx(s), a = this.p[i], b = this.p[i + 1];
      const t = (s - this.cum[i]) / (this.cum[i + 1] - this.cum[i] || 1);
      return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
    }
    frame(s) {
      const [x, z] = this.pos(s);
      let s0 = s - 1.5, s1 = s + 1.5;
      if (!this.closed) { s0 = Math.max(0, s0); s1 = Math.min(this.length, s1); }
      const a = this.pos(s0), b = this.pos(s1);
      let tx = b[0] - a[0], tz = b[1] - a[1];
      const L = Math.hypot(tx, tz) || 1; tx /= L; tz /= L;
      return { x, z, tx, tz, nx: -tz, nz: tx, h: Math.atan2(tz, tx) };
    }
    // offset-punkt
    at(s, off) { const f = this.frame(s); return [f.x + f.nx * off, f.z + f.nz * off]; }
    // projiser punkt til banen. Returnerer {s, lat, d}
    project(x, z, s0, s1) {
      let i0 = 0, i1 = this.n - 2;
      if (s0 != null) { i0 = clamp(Math.floor(s0 / this.step), 0, this.n - 2); i1 = clamp(Math.ceil(s1 / this.step), 0, this.n - 2); }
      let best = Infinity, bs = 0, blat = 0;
      const P = this.p;
      for (let i = i0; i <= i1; i++) {
        const a = P[i], b = P[i + 1];
        const dx = b[0] - a[0], dz = b[1] - a[1];
        const L2 = dx * dx + dz * dz || 1;
        let t = ((x - a[0]) * dx + (z - a[1]) * dz) / L2;
        t = t < 0 ? 0 : t > 1 ? 1 : t;
        const px = a[0] + dx * t, pz = a[1] + dz * t;
        const ex = x - px, ez = z - pz;
        const d2 = ex * ex + ez * ez;
        if (d2 < best) {
          best = d2;
          const L = Math.sqrt(L2);
          bs = this.cum[i] + t * (this.cum[i + 1] - this.cum[i]);
          blat = (ex * -dz + ez * dx) / L; // høyre positiv
        }
      }
      return { s: bs, lat: blat, d: Math.sqrt(best) };
    }
    // projeksjon med lokalt søkevindu rundt et hint
    projectNear(x, z, hint, win = 60) { return this.project(x, z, Math.max(0, hint - win), hint + win); }
    reversed(name) { return new Path(this.p.slice().reverse(), { step: this.step, name }); }
  }
  SIM.Path = Path;

  // punktgeneratorer
  SIM.line = (x0, z0, x1, z1) => [[x0, z0], [x1, z1]];
  SIM.bez = (p0, p1, p2, p3, n = 40) => {
    const o = [];
    for (let i = 0; i <= n; i++) {
      const t = i / n, u = 1 - t;
      o.push([u * u * u * p0[0] + 3 * u * u * t * p1[0] + 3 * u * t * t * p2[0] + t * t * t * p3[0], u * u * u * p0[1] + 3 * u * u * t * p1[1] + 3 * u * t * t * p2[1] + t * t * t * p3[1]]);
    }
    return o;
  };
  SIM.arc = (cx, cz, r, a0, a1, n) => {
    n = n || Math.max(8, Math.ceil((Math.abs(a1 - a0) * r) / 1.5));
    const o = [];
    for (let i = 0; i <= n; i++) { const a = a0 + ((a1 - a0) * i) / n; o.push([cx + Math.cos(a) * r, cz + Math.sin(a) * r]); }
    return o;
  };
  SIM.join = (...arrs) => {
    const o = [];
    arrs.forEach((a) => a.forEach((p) => { const l = o[o.length - 1]; if (!l || Math.hypot(l[0] - p[0], l[1] - p[1]) > 0.05) o.push(p); }));
    return o;
  };
  // kurve fra segmenter med krumning: [{L, k}] (k = 1/R, positiv = høyresving)
  SIM.curvy = (x, z, h, segs) => {
    const o = [[x, z]];
    segs.forEach((sg) => {
      const n = Math.ceil(sg.L / 2);
      const ds = sg.L / n;
      for (let i = 0; i < n; i++) { h += (sg.k || 0) * ds; x += Math.cos(h) * ds; z += Math.sin(h) * ds; o.push([x, z]); }
    });
    return o;
  };

  // ------------------------------------------------------------------
  // GB: geometribygger som samler flater per materiale
  // ------------------------------------------------------------------
  class GB {
    constructor() { this.b = {}; }
    g(k) { return this.b[k] || (this.b[k] = { p: [], n: [] }); }
    tri(k, a, b, c, n = [0, 1, 0]) {
      const g = this.g(k);
      g.p.push(a[0], a[1], a[2], b[0], b[1], b[2], c[0], c[1], c[2]);
      g.n.push(n[0], n[1], n[2], n[0], n[1], n[2], n[0], n[1], n[2]);
    }
    // flat firkant (x,z) i høyde y, rekkefølge a-b-c-d rundt
    quad(k, a, b, c, d, y = 0) {
      const A = [a[0], y, a[1]], B = [b[0], y, b[1]], C = [c[0], y, c[1]], D = [d[0], y, d[1]];
      this.tri(k, A, B, C); this.tri(k, A, C, D);
    }
    // bånd langs bane mellom offsets oa..ob (tall eller funksjon av s)
    ribbon(k, path, s0, s1, oa, ob, y = 0.02, ds = 1) {
      const fa = typeof oa === 'function' ? oa : () => oa;
      const fb = typeof ob === 'function' ? ob : () => ob;
      s0 = Math.max(0, s0); s1 = Math.min(path.length, s1);
      if (s1 <= s0) return;
      let prev = null;
      for (let s = s0; ; s += ds) {
        const ss = Math.min(s, s1);
        const f = path.frame(ss);
        const A = fa(ss), Bo = fb(ss);
        const a = [f.x + f.nx * A, f.z + f.nz * A], b = [f.x + f.nx * Bo, f.z + f.nz * Bo];
        if (prev) this.quad(k, prev[0], prev[1], b, a, y);
        prev = [a, b];
        if (ss >= s1) break;
      }
    }
    dashes(k, path, s0, s1, off, w, dash, gap, y = 0.05) {
      for (let s = s0; s < s1; s += dash + gap) this.ribbon(k, path, s, Math.min(s + dash, s1), (q) => (typeof off === 'function' ? off(q) : off) - w / 2, (q) => (typeof off === 'function' ? off(q) : off) + w / 2, y, 0.5);
    }
    solid(k, path, s0, s1, off, w = 0.15, y = 0.05) {
      this.ribbon(k, path, s0, s1, (q) => (typeof off === 'function' ? off(q) : off) - w / 2, (q) => (typeof off === 'function' ? off(q) : off) + w / 2, y, 1);
    }
    // vertikal vegg langs bane (rekkverk, kantstein)
    wall(k, path, s0, s1, off, y0, y1, ds = 2) {
      s0 = Math.max(0, s0); s1 = Math.min(path.length, s1);
      let prev = null;
      for (let s = s0; ; s += ds) {
        const ss = Math.min(s, s1);
        const f = path.frame(ss);
        const o = typeof off === 'function' ? off(ss) : off;
        const p = [f.x + f.nx * o, f.z + f.nz * o];
        if (prev) {
          const nx = -(p[1] - prev[1]), nz = p[0] - prev[0];
          const L = Math.hypot(nx, nz) || 1;
          const n = [nx / L, 0, nz / L];
          this.tri(k, [prev[0], y0, prev[1]], [p[0], y0, p[1]], [p[0], y1, p[1]], n);
          this.tri(k, [prev[0], y0, prev[1]], [p[0], y1, p[1]], [prev[0], y1, prev[1]], n);
        }
        prev = p;
        if (ss >= s1) break;
      }
    }
    disc(k, cx, cz, r, y = 0.02, seg = 48) {
      for (let i = 0; i < seg; i++) {
        const a0 = (i / seg) * Math.PI * 2, a1 = ((i + 1) / seg) * Math.PI * 2;
        this.tri(k, [cx, y, cz], [cx + Math.cos(a1) * r, y, cz + Math.sin(a1) * r], [cx + Math.cos(a0) * r, y, cz + Math.sin(a0) * r]);
      }
    }
    annulus(k, cx, cz, r0, r1, y = 0.02, seg = 72, a0 = 0, a1 = Math.PI * 2) {
      for (let i = 0; i < seg; i++) {
        const b0 = a0 + ((a1 - a0) * i) / seg, b1 = a0 + ((a1 - a0) * (i + 1)) / seg;
        const p = (a, r) => [cx + Math.cos(a) * r, cz + Math.sin(a) * r];
        this.quad(k, p(b0, r0), p(b1, r0), p(b1, r1), p(b0, r1), y);
      }
    }
    cylWall(k, cx, cz, r, y0, y1, seg = 48) {
      for (let i = 0; i < seg; i++) {
        const a0 = (i / seg) * Math.PI * 2, a1 = ((i + 1) / seg) * Math.PI * 2;
        const am = (a0 + a1) / 2, n = [Math.cos(am), 0, Math.sin(am)];
        const p0 = [cx + Math.cos(a0) * r, cz + Math.sin(a0) * r], p1 = [cx + Math.cos(a1) * r, cz + Math.sin(a1) * r];
        this.tri(k, [p0[0], y0, p0[1]], [p1[0], y0, p1[1]], [p1[0], y1, p1[1]], n);
        this.tri(k, [p0[0], y0, p0[1]], [p1[0], y1, p1[1]], [p0[0], y1, p0[1]], n);
      }
    }
    build(scene, mats) {
      Object.keys(this.b).forEach((k) => {
        const g = this.b[k];
        if (!g.p.length) return;
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.Float32BufferAttribute(g.p, 3));
        geo.setAttribute('normal', new THREE.Float32BufferAttribute(g.n, 3));
        geo.computeBoundingSphere();
        const m = new THREE.Mesh(geo, mats[k] || mats.default);
        m.matrixAutoUpdate = false;
        scene.add(m);
      });
    }
  }
  SIM.GB = GB;

  // ------------------------------------------------------------------
  // Materialer
  // ------------------------------------------------------------------
  SIM.makeMaterials = function (night) {
    const P = (c, o = {}) => new THREE.MeshPhongMaterial(Object.assign({ color: c, shininess: 4, specular: 0x111111, side: THREE.DoubleSide }, o));
    const mark = (c) => P(c, { polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2, emissive: night ? 0x000000 : 0x000000 });
    return {
      default: P(0x888888),
      ground: P(night ? 0x2a3a24 : 0x5e7f45),
      grass2: P(night ? 0x26341f : 0x6b8b4c),
      asphalt: P(0x45484c, { polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1 }),
      asphalt2: P(0x52565b, { polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1 }),
      shoulder: P(0x5a5d61, { polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1 }),
      white: mark(0xf2f2ee),
      yellow: mark(0xf0c010),
      sidewalk: P(0x9c9b95),
      curb: P(0xc8c6be),
      rail: P(0xb9bec4, { shininess: 40, specular: 0x666666 }),
      island: P(night ? 0x2f4428 : 0x6f9650),
      hedge: P(night ? 0x1d2e18 : 0x34572a),
      gravel: P(0x8a8172),
      rail2: P(0x7d6d5d),
    };
  };

  // ------------------------------------------------------------------
  // Biler og annet
  // ------------------------------------------------------------------
  const geoCache = {};
  const boxGeo = (l, h, w) => { const k = l + '|' + h + '|' + w; return geoCache[k] || (geoCache[k] = new THREE.BoxGeometry(l, h, w)); };
  const matCache = {};
  const lam = (c, o) => { const k = c + JSON.stringify(o || {}); return matCache[k] || (matCache[k] = new THREE.MeshLambertMaterial(Object.assign({ color: c }, o || {}))); };

  function box(g, l, h, w, mat, x, y, z) {
    const m = new THREE.Mesh(boxGeo(l, h, w), mat);
    m.position.set(x, y, z);
    g.add(m);
    return m;
  }
  const CAR_COLORS = [0xf4f4f2, 0x1d1f22, 0x7b8188, 0xaeb4ba, 0x1f3f75, 0x8a1c1c, 0x2f5f3a, 0x5a6d7d, 0xd9d4c7, 0x3b3f45, 0x9c2b1f, 0x274b8f];
  SIM.CAR_COLORS = CAR_COLORS;

  // ---- bilmodeller: geometri slås sammen per materialrolle (få tegnekall) ----
  const carGeoCache = {};
  const _m4 = new THREE.Matrix4(), _e = new THREE.Euler(), _q = new THREE.Quaternion(), _v = new THREE.Vector3(), _s = new THREE.Vector3(1, 1, 1);
  function partsBuilder() {
    const roles = {};
    const push = (role, geo, x, y, z, rx = 0, ry = 0, rz = 0) => {
      const g = geo.index ? geo.toNonIndexed() : geo.clone();
      _e.set(rx, ry, rz); _q.setFromEuler(_e); _v.set(x, y, z);
      _m4.compose(_v, _q, _s);
      g.applyMatrix4(_m4);
      (roles[role] = roles[role] || []).push(g);
    };
    const merge = () => {
      const out = {};
      Object.entries(roles).forEach(([role, list]) => {
        let n = 0; list.forEach((g) => (n += g.attributes.position.count));
        const pos = new Float32Array(n * 3), nor = new Float32Array(n * 3);

  SIM.makeCar = function (opts = {}) {

<script>/* js/sim/engine.js */
/* Kjøresimulator-motor: fysikk, trafikk (IDM), speil/blindsone, HUD, vurdering. */

  // ------------------------------------------------------------------

    has(sev) { return this.items.some((i) => i.sev === sev); }

    }

  SIM.Protocol = Protocol;

  // ------------------------------------------------------------------
  // Lyd
  // ------------------------------------------------------------------
  class Sound {

        this.eng2 = c.createOscillator(); this.eng2.type = 'triangle';
        this.lp = c.createBiquadFilter(); this.lp.type = 'lowpass'; this.lp.frequency.value = 380;
        this.eg = c.createGain(); this.eg.gain.value = 0;
        this.eng.connect(this.lp); this.eng2.connect(this.lp); this.lp.connect(this.eg); this.eg.connect(this.master);
        this.eng.start(); this.eng2.start();
        // vind/dekkstøy
        const buf = c.createBuffer(1, c.sampleRate * 2, c.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        this.noiseBuf = buf;
        this.wind = c.createBufferSource(); this.wind.buffer = buf; this.wind.loop = true;
        this.wf = c.createBiquadFilter(); this.wf.type = 'bandpass'; this.wf.frequency.value = 500; this.wf.Q.value = 0.6;
        this.wg = c.createGain(); this.wg.gain.value = 0;
        this.wind.connect(this.wf); this.wf.connect(this.wg); this.wg.connect(this.master); this.wind.start();
        this.ok = true;

    engine(v, thr) {

  function rectCorners(x, z, h, L, W) {
    const c = Math.cos(h), s = Math.sin(h), l = L / 2, w = W / 2;

  }

    for (const P of [A, B]) {
      for (let i = 0; i < 4; i++) {
        const p1 = P[i], p2 = P[(i + 1) % 4];
        const nx = p2[1] - p1[1], nz = p1[0] - p2[0];
        let amin = Infinity, amax = -Infinity, bmin = Infinity, bmax = -Infinity;
        for (const q of A) { const d = q[0] * nx + q[1] * nz; amin = Math.min(amin, d); amax = Math.max(amax, d); }
        for (const q of B) { const d = q[0] * nx + q[1] * nz; bmin = Math.min(bmin, d); bmax = Math.max(bmax, d); }
        if (amax < bmin || bmax < amin) return false;
      }
    }

  }

    // ---------------- input ----------------

      wheel.addEventListener('pointermove', (e) => {
        if (e.pointerId !== wid) return;

    toggleBlink(dir) {

    readInput(dt) {
      const k = this.keys, h = this.touch.holds || {};

        if (gp.buttons[7] && gp.buttons[7].value > 0.05) thr = gp.buttons[7].value;
        if (gp.buttons[6] && gp.buttons[6].value > 0.05) brk = gp.buttons[6].value;

        const lx = (q.x - p.x) * Math.cos(p.h) + (q.z - p.z) * Math.sin(p.h);
        const lz = -(q.x - p.x) * Math.sin(p.h) + (q.z - p.z) * Math.cos(p.h);

        if (this._over > 0.6) this.coach('fart', `Fartsgrensen er ${lim} km/t`, 6);

    crossingMonitor(kmh) {

        if (appr && Math.abs(al) < 25 && active.length) this.coach('gf', 'Gående i gangfeltet. Stopp i god avstand.', 6);

            if (near) this.prot.once('gf-crit', 'Vikeplikt', 'critical', 'Farlig nær en fotgjenger i gangfeltet', 'Du kjørte gjennom gangfeltet rett ved en gående. Du har vikeplikt for gående som er ute i eller på vei ut i gangfeltet.');

    nightMonitor(dt) {

    // ---------------- render ----------------
    camPose(mode) {

      }
      if (mode === 1) {
        const pos = new THREE.Vector3(p.x - fx * 9, 3.4, p.z - fz * 9);

      }
      const pos = new THREE.Vector3(p.x + fx * 14, 70, p.z + fz * 14);

          const far = p.high ? 60 : 24;

    drawMap() {

    togglePause() {

        o.innerHTML = `<div class="so-card so-pause"><h2>Pause</h2><div class="so-actions"><button type="button" class="btn btn-primary" data-a="go">Fortsett</button><button type="button" class="btn" data-a="restart">Start på nytt</button><button type="button" class="btn" data-a="exit">Avslutt</button></div></div>`;

    finish() {

      const pr = this.prot;

      const score = pr.score();
      const passed = !crit && !major && score >= 70;
      const result = { id: this.scen.id, score, passed, items: pr.items.slice(), time: this.time };
